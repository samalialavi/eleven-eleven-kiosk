      <stop offset="18%" stop-color="#f3e2b0"/>
      <stop offset="50%" stop-color="#c9a44c"/>
      <stop offset="82%" stop-color="#f3e2b0"/>
      <stop offset="100%" stop-color="#7a5720"/>
    </linearGradient>
    <linearGradient id="bodyMetal" x1="0" y1="0" x2="0" y2="1">
