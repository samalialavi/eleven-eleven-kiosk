  <rect x="58" y="74" width="1484" height="432" rx="134" fill="none" stroke="rgba(243,226,176,0.18)" stroke-width="2"/>
  <rect x="72" y="88" width="1456" height="404" rx="122" fill="none" stroke="rgba(0,0,0,0.55)" stroke-width="3"/>

