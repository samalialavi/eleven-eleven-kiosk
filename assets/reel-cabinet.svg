      <stop offset="48%" stop-color="#070706"/>
      <stop offset="78%" stop-color="#12100d"/>
      <stop offset="100%" stop-color="#1a1612"/>
    </linearGradient>
    <linearGradient id="bodySheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(0,0,0,0.35)"/>
      <stop offset="35%" stop-color="rgba(255,255,255,0.05)"/>
