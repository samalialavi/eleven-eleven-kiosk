<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 580" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="goldBevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8ebc4"/>
      <stop offset="16%" stop-color="#e6c86a"/>
      <stop offset="42%" stop-color="#b8892a"/>
      <stop offset="68%" stop-color="#6e4e16"/>
      <stop offset="86%" stop-color="#d7b45a"/>
      <stop offset="100%" stop-color="#8a6420"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="0">
