<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Eleven Eleven - Jackpot Display</title>
<style>

  :root {
    --gold: #c9a44c;
    --gold-soft: #e8d7a0;
    --ink: #050505;
    --flare: #d4af37;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 100vw; height: 100vh;
    background: #000;
    overflow: hidden;
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    cursor: none;
  }

  #idle { position: fixed; inset: 0; background: #000; z-index: 1; }

  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
    opacity: 0;
    pointer-events: none;
    transition: opacity .45s ease;
    background: #000;
    overflow: hidden;
    --safe-x: clamp(24px, 4vw, 72px);
    --safe-y: clamp(18px, 4vh, 56px);
  }
  #stage.show { opacity: 1; }

  .bg-base, .bg-aura, .bg-shafts, .bg-haze, .bg-particles, .bg-floor, .bg-flash {
    position: absolute; inset: 0; pointer-events: none;
  }
  .bg-base {
    background:
      radial-gradient(120% 80% at 50% 100%, #120c08 0%, #050505 42%, #000 100%);
  }
  .bg-aura {
    background: radial-gradient(ellipse at 50% 46%, color-mix(in srgb, var(--flare) 22%, transparent) 0%, transparent 58%);
    opacity: .55;
    transition: opacity .8s ease;
  }
  .bg-shafts {
    background:
      linear-gradient(108deg, transparent 42%, rgba(201,164,76,0.07) 50%, transparent 58%),
      linear-gradient(78deg, transparent 46%, rgba(232,215,160,0.05) 52%, transparent 60%);
    opacity: .35;
  }
  .bg-haze {
    background: radial-gradient(ellipse at 50% 60%, rgba(255,255,255,0.035), transparent 55%);
  }
  .bg-particles {
    background-image:
      radial-gradient(circle, rgba(232,215,160,0.45) 0 1px, transparent 2px),
      radial-gradient(circle, rgba(255,255,255,0.22) 0 1px, transparent 2px);
    background-size: 180px 220px, 260px 300px;
    background-position: 20% 10%, 70% 40%;
    opacity: .22;
    animation: dustDrift 28s linear infinite;
  }
  @keyframes dustDrift {
    from { background-position: 20% 10%, 70% 40%; }
    to { background-position: 24% 18%, 66% 48%; }
  }
  .bg-floor {
    background: radial-gradient(ellipse at 50% 112%, rgba(201,164,76,0.16), transparent 42%);
  }
  .bg-flash {
    opacity: 0;
    background: radial-gradient(circle at 50% 48%, rgba(255,255,255,0.28), transparent 48%);
  }
  #stage.stage-impact .bg-flash {
    animation: impactFlash .55s ease-out;
  }
  @keyframes impactFlash {
    0% { opacity: .9; }
    100% { opacity: 0; }
  }
  #stage.stage-hold .bg-aura { opacity: .38; }
  #stage.stage-intro .bg-aura { opacity: .2; }

  .brand-mark {
    position: absolute;
    top: var(--safe-y);
    left: 0; right: 0;
    text-align: center;
    z-index: 5;
    opacity: 0;
    transition: opacity .7s ease;
    pointer-events: none;
  }
  .brand-clock {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(18px, 2.1vw, 34px);
    letter-spacing: .42em;
    color: var(--gold-soft);
    text-indent: .42em;
  }
  .brand-name {
    margin-top: .35em;
    font-size: clamp(10px, 1.05vw, 16px);
    letter-spacing: .55em;
    color: rgba(232,215,160,0.72);
    text-indent: .55em;
  }
  #stage.stage-reels .brand-mark { opacity: .32; }
  #stage.stage-impact .brand-mark,
  #stage.stage-hold .brand-mark { opacity: .72; }

  #coins, #marquee, #moneyBurst {
    position: absolute; inset: 0;
    pointer-events: none;
    display: none;
  }
  #confetti { position: absolute; inset: 0; pointer-events: none; z-index: 6; overflow: hidden; }
  .piece {
    position: absolute;
    width: 7px; height: 11px;
    opacity: 0;
    border-radius: 1px;
    animation-name: confettiFall;
    animation-timing-function: cubic-bezier(.15,.7,.25,1);
    animation-fill-mode: forwards;
  }
  @keyframes confettiFall {
    0% { opacity: .95; transform: translate(-50%,-50%) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(.7); }
  }

  #introLogo {
    position: absolute;
    z-index: 8;
    width: min(22vw, 280px);
    max-width: 280px;
    opacity: 0;
    filter: drop-shadow(0 0 18px rgba(201,164,76,0.35));
    transform: scale(.94);
  }
  #introLogo.play {
    animation: logoIn .7s ease-out forwards, logoOut .5s ease forwards 1.05s;
  }
  @keyframes logoIn {
    0% { opacity: 0; transform: scale(.94); filter: drop-shadow(0 0 0 rgba(201,164,76,0)); }
    55% { opacity: 1; transform: scale(1.03); filter: drop-shadow(0 0 28px rgba(201,164,76,0.55)); }
    100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 18px rgba(201,164,76,0.4)); }
  }
  @keyframes logoOut {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.05); }
  }
  #introLogo.play::after {
    content: '';
    position: absolute;
    inset: 42% -30%;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(232,215,160,0.85), transparent);
    animation: logoSweep .7s ease-out;
  }
  @keyframes logoSweep {
    from { transform: translateX(-40%); opacity: 0; }
    40% { opacity: 1; }
    to { transform: translateX(40%); opacity: 0; }
  }

  .content {
    position: relative;
    z-index: 4;
    text-align: center;
    color: #fff;
    width: min(92vw, 1600px);
    padding: 0 var(--safe-x);
  }

  .reel-cabinet {
    display: flex;
    justify-content: center;
    margin: 0 auto 2.4vh;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .5s ease, transform .5s ease;
  }
  #stage.stage-reels .reel-cabinet,
  #stage.stage-impact .reel-cabinet {
    opacity: 1;
    transform: none;
  }
  #stage.stage-hold .reel-cabinet,
  #stage.stage-exit .reel-cabinet {
    opacity: 0;
    pointer-events: none;
  }
  .cabinet-frame {
    position: relative;
    padding: clamp(14px, 1.6vw, 28px) clamp(18px, 2vw, 36px);
    border-radius: clamp(16px, 1.8vw, 28px);
    background:
      linear-gradient(180deg, rgba(58,46,28,0.55), rgba(12,10,8,0.96) 28%, #070706 100%);
    box-shadow:
      0 30px 80px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(232,215,160,0.28),
      inset 0 -18px 30px rgba(0,0,0,0.45);
  }
  .cabinet-frame::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    border: 1px solid rgba(201,164,76,0.55);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    pointer-events: none;
  }
  .cabinet-frame::after {
    content: '';
    position: absolute;
    inset: 8px;
    border-radius: inherit;
    border: 1px solid color-mix(in srgb, var(--flare) 28%, transparent);
    opacity: .5;
    pointer-events: none;
  }

  #reels {
    display: flex;
    gap: clamp(10px, 1.2vw, 22px);
    justify-content: center;
    position: relative;
  }
  #reels.hidden { display: none; }

  .reel {
    width: clamp(72px, 11vw, 168px);
    height: clamp(110px, 18vw, 250px);
    background: linear-gradient(180deg, #17140f, #050505 48%, #14110c);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    box-shadow:
      inset 0 18px 18px rgba(0,0,0,0.55),
      inset 0 -14px 16px rgba(0,0,0,0.4),
      0 0 0 1px rgba(201,164,76,0.22);
  }
  .reel::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.14), transparent 22%, transparent 78%, rgba(0,0,0,0.35));
    z-index: 2;
    pointer-events: none;
  }
  .reel::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 28%, rgba(255,255,255,0.08) 48%, transparent 64%);
    z-index: 3;
    pointer-events: none;
  }
  .reel-window {
    position: absolute;
    inset: 10% 12%;
    overflow: hidden;
    mask-image: linear-gradient(180deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
  }
  .reel-strip {
    display: flex;
    flex-direction: column;
    will-change: transform;
  }
  .reel-digit {
    height: clamp(88px, 14.4vw, 200px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(52px, 9vw, 140px);
    font-weight: 700;
    color: #f7efe0;
    text-shadow: 0 2px 0 rgba(0,0,0,0.65), 0 0 18px color-mix(in srgb, var(--flare) 40%, transparent);
  }
  .reel.spinning .reel-strip {
    animation: reelDrum .16s linear infinite;
  }
  .reel.spinning.decel .reel-strip {
    animation-duration: .42s;
  }
  .reel.spinning.near-miss .reel-strip {
    animation-play-state: paused;
    filter: none;
  }
  .reel.spinning .reel-digit {
    filter: blur(1.4px);
  }
  .reel.locked .reel-strip {
    animation: none;
  }
  .reel.locked {
    animation: reelLock .32s ease;
  }
  @keyframes reelDrum {
    from { transform: translateY(0); }
    to { transform: translateY(-12.5%); }
  }
  @keyframes reelLock {
    0% { transform: scale(1); }
    40% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }

  #revealText { margin-top: 0.4vh; }
  #revealText.reveal-hidden { display: none; }

  .tier-title {
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: .35em;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(18px, 3.1vw, 52px);
    letter-spacing: .38em;
    text-indent: .38em;
    text-transform: uppercase;
    color: var(--gold-soft);
    opacity: 0;
  }
  #stage.stage-impact .tier-title,
  #stage.stage-hold .tier-title {
    animation: titleIn .7s ease forwards;
  }
  @keyframes titleIn {
    from { opacity: 0; letter-spacing: .7em; transform: translateY(-8px); }
    to { opacity: 1; letter-spacing: .38em; transform: none; }
  }
  .tier-label, .jackpot-word { color: inherit; font: inherit; }

  .table-hero {
    margin: 1.2vh 0 2.2vh;
  }
  .table-kicker {
    font-size: clamp(14px, 1.6vw, 26px);
    letter-spacing: .62em;
    text-indent: .62em;
    color: rgba(247,239,224,0.72);
  }
  .table-num, #tableNum {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(84px, 16vw, 268px);
    font-weight: 700;
    line-height: .86;
    color: #fff4d6;
    text-shadow:
      0 3px 0 rgba(0,0,0,0.7),
      0 0 16px color-mix(in srgb, var(--flare) 42%, transparent);
  }
  #stage.stage-impact .table-hero {
    animation: heroIn .55s cubic-bezier(.16,.8,.24,1) both;
  }
  @keyframes heroIn {
    0% { opacity: 0; transform: scale(.92); }
    70% { opacity: 1; transform: scale(1.03); }
    100% { opacity: 1; transform: scale(1); }
  }

  .prize-plaque, #prizeText {
    display: inline-block;
    max-width: min(86vw, 1080px);
    margin: 0 auto;
    padding: .55em 1.15em;
    font-size: clamp(16px, 2.6vw, 48px);
    font-weight: 600;
    letter-spacing: .04em;
    line-height: 1.22;
    text-transform: uppercase;
    color: #f4ead0;
    background: linear-gradient(180deg, rgba(28,22,14,0.92), rgba(8,7,6,0.96));
    border: 1px solid rgba(201,164,76,0.7);
    box-shadow:
      0 10px 30px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.12);
    overflow-wrap: anywhere;
    word-break: break-word;
    opacity: 0;
  }
  #stage.stage-impact #prizeText,
  #stage.stage-hold #prizeText {
    animation: plaqueIn .55s .12s ease forwards;
  }
  @keyframes plaqueIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  #panel {
    position: fixed; bottom: 16px; inset-inline-start: 16px;
    z-index: 99;
    background: rgba(20,20,20,0.94);
    border: 1px solid #333;
    border-radius: 10px;
    padding: 12px 14px;
    color: #aaa;
    font-size: 12px;
    display: none;
    gap: 8px;
    flex-direction: column;
    max-width: 380px;
    font-family: "Segoe UI", Arial, sans-serif;
    cursor: auto;
  }
  #panel.open { display: flex; }
  #panel input, #panel select, #panel button {
    font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 1px solid #444;
    background: #111; color: #eee;
  }
  #panel button { cursor: pointer; }
  #panel .row { display:flex; gap:6px; align-items:center; flex-wrap: wrap; }
  #panel label { font-size: 11px; white-space: nowrap; }
  #status { color:#7a7; font-size:11px; line-height:1.5; }
  #configPreview { color:#666; font-size:10px; max-height:80px; overflow-y:auto; white-space:pre-wrap; }
</style>
</head>

<script>
(function () {
// KIOSK_REVEAL_HELPERS_START
const REEL_MIN_COLUMNS = 3;
const MIN_SUSPENSE_MS = 11000;
const REEL_STAGGER_MS = 3000;
const LOGO_INTRO_MS = 1550;
const MUSIC_FADE_MS = 1200;
const LAST_TEST_STORAGE_KEY = 'jackpot_last_reveal_test_event_id';
const LAST_EVENT_STORAGE_KEY = 'jackpot.reveal.lastEventId';
const REVEAL_TEST_TABLE = '11';
const REVEAL_TEST_PRIZE_FALLBACK = 'TEST REVEAL';
const DEFAULT_OFF_HOURS_TEST_POLLING_SECONDS = 30;

function parseOffHoursTestPollingSeconds(raw) {
  if (raw === undefined || raw === null || String(raw).trim() === '') {
    return DEFAULT_OFF_HOURS_TEST_POLLING_SECONDS;
  }
  const s = String(raw).trim();
  if (!/^\d+$/.test(s)) return DEFAULT_OFF_HOURS_TEST_POLLING_SECONDS;
  const n = Number(s);
  if (!Number.isInteger(n) || n < 2 || n > 300) return DEFAULT_OFF_HOURS_TEST_POLLING_SECONDS;
  return n;
}

function parseRevealMusicEnabled(raw) {
  return String(raw == null ? '' : raw).trim().toLowerCase() === 'yes' || raw === true;
}

function parseRevealMusicVolume(raw) {
  if (raw === undefined || raw === null || String(raw).trim() === '') return 80;
  const n = parseInt(String(raw).trim(), 10);
  if (!Number.isFinite(n) || n < 0 || n > 100) return 80;
  return n;
}

function volumePercentToAudio(pct) {
  const n = Number(pct);
  if (!Number.isFinite(n)) return 0.8;
  if (n <= 0) return 0;
  if (n >= 100) return 1;
  return n / 100;
}

function isSafeRelativeMusicPath(path) {
  const raw = String(path == null ? '' : path).trim();
  if (!raw) return false;
  if (raw !== String(path).trim()) return false;
  const lower = raw.toLowerCase();
  if (/^[a-z][a-z0-9+.-]*:/.test(lower)) return false;
  if (raw.indexOf('\\') >= 0 || raw.charAt(0) === '/' || raw.indexOf('//') >= 0) return false;
  if (!/^[A-Za-z0-9][\w./-]*$/.test(raw)) return false;
  const parts = raw.split('/');
  for (let i = 0; i < parts.length; i++) {
    if (parts[i] === '' || parts[i] === '.' || parts[i] === '..') return false;
  }
  return parts.length >= 2;
}

function resolveMusicUrl(path, baseUri) {
  if (!isSafeRelativeMusicPath(path)) return '';
  try {
    const base = baseUri || (typeof document !== 'undefined' ? document.baseURI : '');
    return new URL(path, base).href;
  } catch (e) {
    return '';
  }
}

function selectTierMusicFile(config, tierKey) {
  const tiers = (config && config.tiers) || {};
  const tier = tiers[tierKey] || {};
  return String(tier.music_file == null ? '' : tier.music_file).trim();
}

function reelCharsForTable(table) {
  return String(table == null || table === '' ? '0' : table).padStart(REEL_MIN_COLUMNS, '0').split('');
}

function reelCountForTable(table) {
  return reelCharsForTable(table).length;
}

function displayTableText(table) {
  if (table == null || table === '') return '--';
  return String(table);
}

function computeFinalLockMs(reelCount) {
  const n = Number(reelCount);
  if (!Number.isFinite(n) || n < 1) return MIN_SUSPENSE_MS;
  return MIN_SUSPENSE_MS + (n - 1) * REEL_STAGGER_MS;
}

function computeRevealHoldMs(durationSeconds) {
  const n = Number(durationSeconds);
  if (!Number.isFinite(n) || n < 0) return 0;
  return n * 1000;
}

function computeFadeStartOffsetMs(holdMs) {
  const hold = Number(holdMs);
  if (!Number.isFinite(hold) || hold <= 0) return 0;
  return Math.max(0, hold - MUSIC_FADE_MS);
}

// Predicted stage lifetime from logo start IF reel locks match computeFinalLockMs.
// Authoritative close is scheduled from the actual all-reels-locked callback, not this value.
function computeRevealTotalMs(table, durationSeconds) {
  return LOGO_INTRO_MS + computeFinalLockMs(reelCountForTable(table)) + computeRevealHoldMs(durationSeconds);
}

function createRevealHoldScheduler(opts) {
  opts = opts || {};
  const setTimeoutFn = opts.setTimeoutFn || (typeof setTimeout === 'function' ? setTimeout : null);
  const clearTimeoutFn = opts.clearTimeoutFn || (typeof clearTimeout === 'function' ? clearTimeout : null);
  let fadeTimer = null;
  let closeTimer = null;
  let generation = 0;

  function clear() {
    generation += 1;
    if (fadeTimer != null && clearTimeoutFn) clearTimeoutFn(fadeTimer);
    if (closeTimer != null && clearTimeoutFn) clearTimeoutFn(closeTimer);
    fadeTimer = null;
    closeTimer = null;
  }

  function startAfterFinalReveal(durationSeconds, onFade, onClose) {
    clear();
    const gen = generation;
    const holdMs = computeRevealHoldMs(durationSeconds);
    const fadeAt = computeFadeStartOffsetMs(holdMs);
    if (!setTimeoutFn) {
      if (onFade) onFade();
      if (onClose) onClose();
      return { holdMs: holdMs, fadeAt: fadeAt };
    }
    fadeTimer = setTimeoutFn(function () {
      if (gen !== generation) return;
      fadeTimer = null;
      if (onFade) onFade();
    }, fadeAt);
    closeTimer = setTimeoutFn(function () {
      if (gen !== generation) return;
      closeTimer = null;
      if (onClose) onClose();
    }, holdMs);
    return { holdMs: holdMs, fadeAt: fadeAt };
  }

  return {
    startAfterFinalReveal: startAfterFinalReveal,
    clear: clear,
    hasCloseTimer: function () { return closeTimer != null; },
    hasFadeTimer: function () { return fadeTimer != null; }
  };
}

function formatLocalStamp(date) {
  const d = date || new Date();
  const p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
    ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

function isRevealTestExpired(expiresAt, nowStamp) {
  if (!expiresAt) return true;
  return String(expiresAt) <= String(nowStamp || formatLocalStamp(new Date()));
}

function chooseStatusPlayback(data, opts) {
  const o = opts || {};
  const playing = !!o.playing;
  const withinHours = o.withinHours !== false;
  const lastEventId = o.lastEventId || null;
  const lastTestEventId = o.lastTestEventId || null;
  const nowStamp = o.nowStamp || formatLocalStamp(new Date());
  if (playing) {
    return { action: 'wait', reason: 'already_playing' };
  }
  if (withinHours && data && data.tier && data.id && data.id !== lastEventId) {
    return {
      action: 'play_production',
      id: data.id,
      tier: data.tier,
      table: data.table,
      prize: data.prize,
      delaySeconds: typeof data.delay_seconds === 'number' ? data.delay_seconds : 0
    };
  }
  const test = data && data.test_event;
  if (!test || test.is_test !== true) {
    return { action: 'none' };
  }
  if (!test.id || test.id === lastTestEventId) {
    return { action: 'none', reason: 'already_consumed' };
  }
  if (isRevealTestExpired(test.expires_at, nowStamp)) {
    return { action: 'none', reason: 'expired' };
  }
  if (test.tier !== 'minor' && test.tier !== 'major' && test.tier !== 'grand') {
    return { action: 'none', reason: 'invalid_tier' };
  }
  return {
    action: 'play_test',
    id: test.id,
    tier: test.tier,
    table: test.table || REVEAL_TEST_TABLE,
    prize: test.prize || REVEAL_TEST_PRIZE_FALLBACK,
    delaySeconds: 0
  };
}

function createRevealAudioController(opts) {
  opts = opts || {};
  const AudioImpl = opts.Audio;
  const setTimeoutFn = opts.setTimeoutFn || (typeof setTimeout === 'function' ? setTimeout : null);
  const clearTimeoutFn = opts.clearTimeoutFn || (typeof clearTimeout === 'function' ? clearTimeout : null);
  const nowFn = opts.nowFn || function () {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  };
  const baseUri = opts.baseUri;
  const onStatus = opts.onStatus || function () {};
  const cache = {};
  let current = null;
  let fadeTimer = null;
  let generation = 0;

  function clearFade() {
    if (fadeTimer && clearTimeoutFn) clearTimeoutFn(fadeTimer);
    fadeTimer = null;
  }

  function stopNow() {
    generation += 1;
    clearFade();
    if (current) {
      try { current.pause(); } catch (e) {}
      try { current.currentTime = 0; } catch (e) {}
    }
    current = null;
  }

  function getOrCreate(url) {
    if (!AudioImpl || !url) return null;
    if (cache[url] && cache[url].src === url) return cache[url];
    const audio = new AudioImpl();
    audio.preload = 'auto';
    audio.loop = false;
    audio.src = url;
    try { audio.load(); } catch (e) {}
    cache[url] = audio;
    return audio;
  }

  function preload(config) {
    if (!parseRevealMusicEnabled(config && config.reveal_music_enabled)) return;
    ['minor', 'major', 'grand'].forEach(function (tierKey) {
      const file = selectTierMusicFile(config, tierKey);
      const url = resolveMusicUrl(file, baseUri);
      if (url) getOrCreate(url);
    });
  }

  function playTier(tierKey, config) {
    stopNow();
    if (!parseRevealMusicEnabled(config && config.reveal_music_enabled)) {
      return { attempted: false, reason: 'disabled' };
    }
    const file = selectTierMusicFile(config, tierKey);
    const url = resolveMusicUrl(file, baseUri);
    if (!url) {
      onStatus('Reveal music skipped: no usable file for ' + tierKey);
      return { attempted: false, reason: 'missing_file' };
    }
    const audio = getOrCreate(url);
    if (!audio) {
      onStatus('Reveal music skipped: audio unavailable');
      return { attempted: false, reason: 'no_audio' };
    }
    const vol = volumePercentToAudio(parseRevealMusicVolume(config && config.reveal_music_volume));
    try { audio.volume = vol; } catch (e) {}
    try { audio.currentTime = 0; } catch (e) {}
    current = audio;
    const gen = generation;
    let playResult = { attempted: true, url: url, rejected: false };
    try {
      const p = audio.play();
      if (p && typeof p.then === 'function') {
        p.then(function () {}, function (err) {
          if (gen !== generation) return;
          playResult.rejected = true;
          onStatus('Reveal music blocked or failed: ' + (err && err.message ? err.message : 'autoplay'));
        });
      }
    } catch (err) {
      playResult.rejected = true;
      onStatus('Reveal music failed: ' + (err && err.message ? err.message : String(err)));
    }
    return playResult;
  }

  function fadeOut(ms) {
    const audio = current;
    if (!audio) return;
    const duration = typeof ms === 'number' && ms > 0 ? ms : MUSIC_FADE_MS;
    clearFade();
    const startVol = Number(audio.volume);
    const start = nowFn();
    const gen = generation;
    function tick() {
      if (gen !== generation || current !== audio) return;
      const now = nowFn();
      const t = Math.min(1, (now - start) / duration);
      try { audio.volume = Math.max(0, startVol * (1 - t)); } catch (e) {}
      if (t >= 1) {
        try { audio.pause(); } catch (e) {}
        try { audio.currentTime = 0; } catch (e) {}
        if (current === audio) current = null;
        fadeTimer = null;
        return;
      }
      if (setTimeoutFn) fadeTimer = setTimeoutFn(tick, 50);
    }
    if (setTimeoutFn) fadeTimer = setTimeoutFn(tick, 50);
    else {
      try { audio.pause(); } catch (e) {}
      try { audio.currentTime = 0; } catch (e) {}
      current = null;
    }
  }

  function unlock() {
    const urls = Object.keys(cache);
    const audio = urls.length ? cache[urls[0]] : (AudioImpl ? new AudioImpl() : null);
    if (!audio) return { ok: false };
    const prevVol = audio.volume;
    try { audio.volume = 0.05; } catch (e) {}
    try {
      const p = audio.play();
      if (p && typeof p.then === 'function') {
        p.then(function () {
          try { audio.pause(); } catch (e2) {}
          try { audio.currentTime = 0; } catch (e2) {}
          try { audio.volume = prevVol; } catch (e2) {}
        }, function (err) {
          onStatus('Audio unlock failed: ' + (err && err.message ? err.message : 'autoplay'));
        });
      }
      return { ok: true };
    } catch (err) {
      onStatus('Audio unlock failed: ' + (err && err.message ? err.message : String(err)));
      return { ok: false };
    }
  }

  return {
    preload: preload,
    playTier: playTier,
    fadeOut: fadeOut,
    stopNow: stopNow,
    unlock: unlock,
    getCurrent: function () { return current; }
  };
}
// KIOSK_REVEAL_HELPERS_END

  // ---------------------------------------------------------------
  // Nothing about tiers, colors, labels, durations or the curtain
  // delay is hardcoded here. All of it comes from the /jackpot-config
  // endpoint (backed by the Google Sheet "Config" tab). This object
  // only holds sane fallbacks used before the first successful fetch.
  // ---------------------------------------------------------------
  let CONFIG = {
    curtain_delay_seconds: 45,
    status_polling_seconds: 5,
    tiers: {
      minor: { label: '—', color: '#d4af37', duration_seconds: 8 },
      major: { label: '—', color: '#ff7a1a', duration_seconds: 12 },
      grand: { label: '—', color: '#ff1744', duration_seconds: 18 }
    }
  };

  const stage = document.getElementById('stage');
  const tierLabel = document.getElementById('tierLabel');
  const jackpotWord = document.getElementById('jackpotWord');
  const tableNum = document.getElementById('tableNum');
  const prizeText = document.getElementById('prizeText');
  const coinsEl = document.getElementById('coins');
  const marqueeEl = document.getElementById('marquee');
  const confettiEl = document.getElementById('confetti');
  const moneyBurstEl = document.getElementById('moneyBurst');
  const reelsEl = document.getElementById('reels');
  const statusEl = document.getElementById('status');
  const panel = document.getElementById('panel');
  const configPreview = document.getElementById('configPreview');

  let playing = false;
  let coinLoopTimer = null;
  const holdScheduler = createRevealHoldScheduler();
  const revealAudio = createRevealAudioController({
    Audio: typeof Audio !== 'undefined' ? Audio : null,
    baseUri: typeof document !== 'undefined' ? document.baseURI : '',
    onStatus: function (msg) { statusEl.textContent = msg; }
  });

    const CONFETTI_COLORS = ['#f4e4b4', '#ffffff', '#d4af37'];
  const REEL_GLYPHS = '0123456789';
  const REEL_STRIP_CYCLES = 8;
  let reelControllers = [];
  let impactTimer = null;

  function clearStagePhases() {
    ['stage-intro', 'stage-reels', 'stage-impact', 'stage-hold', 'stage-exit'].forEach(function (c) {
      stage.classList.remove(c);
    });
  }

  function setStagePhase(phase) {
    clearStagePhases();
    if (phase) stage.classList.add(phase);
  }

  function buildMarquee() {
    if (marqueeEl) marqueeEl.innerHTML = '';
  }

  function spawnCoin() {}

  function startCoinRain() {
    stopCoinRain();
  }

  function stopCoinRain() {
    if (coinLoopTimer) clearInterval(coinLoopTimer);
    coinLoopTimer = null;
    if (coinsEl) coinsEl.innerHTML = '';
  }

  function buildConfetti() {
    confettiEl.innerHTML = '';
    const n = 18;
    const flare = (getComputedStyle(document.documentElement).getPropertyValue('--flare') || '#d4af37').trim();
    const colors = CONFETTI_COLORS.concat([flare]);
    for (let i = 0; i < n; i++) {
      const p = document.createElement('div');
      p.className = 'piece';
      const angle = (-Math.PI / 2) + (Math.random() - 0.5) * 1.45;
      const dist = 140 + Math.random() * 240;
      p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--dy', (Math.sin(angle) * dist + 90 + Math.random() * 180) + 'px');
      p.style.setProperty('--rot', (Math.random() * 240 - 120) + 'deg');
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.left = '50%';
      p.style.top = '34%';
      p.style.animationDuration = (0.85 + Math.random() * 0.55) + 's';
      p.style.animationDelay = (Math.random() * 0.1) + 's';
      confettiEl.appendChild(p);
    }
  }

  function buildMoneyBurst() {
    if (moneyBurstEl) moneyBurstEl.innerHTML = '';
  }

  function buildReelStrip() {
    const wrap = document.createElement('div');
    wrap.className = 'reel-strip';
    for (let c = 0; c < REEL_STRIP_CYCLES; c++) {
      for (let d = 0; d < 10; d++) {
        const span = document.createElement('span');
        span.className = 'reel-digit';
        span.textContent = String(d);
        wrap.appendChild(span);
      }
    }
    return wrap;
  }

  function snapReelStrip(strip, ch) {
    const digit = parseInt(String(ch), 10);
    const safe = Number.isFinite(digit) ? ((digit % 10) + 10) % 10 : 0;
    const total = REEL_STRIP_CYCLES * 10;
    const index = (REEL_STRIP_CYCLES - 2) * 10 + safe;
    const pct = (100 / total) * index;
    strip.style.animation = 'none';
    strip.style.transform = 'translateY(-' + pct + '%)';
  }

  function buildReels(finalTable) {
    reelsEl.innerHTML = '';
    reelControllers.forEach(function (c) { c.stop(); });
    reelControllers = [];

    const chars = reelCharsForTable(finalTable);
    const nodes = [];

    chars.forEach(function (ch) {
      const reel = document.createElement('div');
      reel.className = 'reel spinning';
      const windowEl = document.createElement('div');
      windowEl.className = 'reel-window';
      const strip = buildReelStrip();
      windowEl.appendChild(strip);
      reel.appendChild(windowEl);
      reelsEl.appendChild(reel);
      nodes.push({
        reel: reel,
        strip: strip,
        roll: strip,
        finalChar: ch
      });
    });

    return nodes;
  }

  function runReel(node, totalMs, onLocked) {
    const start = performance.now();
    const decelStart = totalMs - 2500;
    const nearMissAt = [totalMs * 0.35 + Math.random() * 1500, totalMs * 0.68 + Math.random() * 1500];
    let nextNearMissIdx = 0;
    let stopped = false;
    let timer = null;

    function tick() {
      if (stopped) return;
      const elapsed = performance.now() - start;

      if (elapsed >= totalMs) {
        node.reel.classList.remove('spinning', 'decel', 'near-miss');
        node.reel.classList.add('locked');
        snapReelStrip(node.strip, node.finalChar);
        stopped = true;
        if (onLocked) onLocked();
        return;
      }

      if (nextNearMissIdx < nearMissAt.length && elapsed >= nearMissAt[nextNearMissIdx]) {
        nextNearMissIdx += 1;
        node.reel.classList.add('near-miss');
        timer = setTimeout(function () {
          node.reel.classList.remove('near-miss');
          tick();
        }, 420);
        return;
      }

      if (elapsed >= decelStart) node.reel.classList.add('decel');
      let delay = 55;
      if (elapsed >= decelStart) {
        const decelProgress = (elapsed - decelStart) / 2500;
        delay = 55 + decelProgress * 185;
      }
      timer = setTimeout(tick, delay);
    }

    timer = setTimeout(tick, 55);
    return { stop: function () { stopped = true; if (timer) clearTimeout(timer); } };
  }

  function lockReels(reelNodes, onAllLocked) {
    let remaining = reelNodes.length;
    reelNodes.forEach(function (node, i) {
      const totalMs = MIN_SUSPENSE_MS + i * REEL_STAGGER_MS;
      const controller = runReel(node, totalMs, function () {
        remaining--;
        if (remaining === 0 && onAllLocked) onAllLocked();
      });
      reelControllers.push(controller);
    });
  }

  function playJackpot(tierKey, table, prize, delaySeconds) {
    const tier = CONFIG.tiers[tierKey];
    if (!tier) return;
    if (playing) return;
    playing = true;
    holdScheduler.clear();
    revealAudio.stopNow();
    if (impactTimer) clearTimeout(impactTimer);

    const waitMs = (typeof delaySeconds === 'number' ? delaySeconds : CONFIG.curtain_delay_seconds) * 1000;
    statusEl.textContent = 'Curtain lowering... (' + (waitMs / 1000) + 's) - ' + tier.label + ' table ' + table;

    setTimeout(() => {
      document.documentElement.style.setProperty('--flare', tier.color);
      tierLabel.textContent = tier.label;
      jackpotWord.textContent = 'JACKPOT';
      tableNum.textContent = displayTableText(table);
      prizeText.textContent = prize || '';

      buildMarquee();
      startCoinRain();

      const reelNodes = buildReels(table);
      reelsEl.classList.add('hidden');
      document.getElementById('revealText').classList.add('reveal-hidden');

      setStagePhase('stage-intro');
      stage.classList.add('show');
      statusEl.textContent = 'Logo intro... - ' + tier.label + ' table ' + table;
      revealAudio.playTier(tierKey, CONFIG);

      const introLogo = document.getElementById('introLogo');
      introLogo.classList.remove('play');
      void introLogo.offsetWidth;
      introLogo.classList.add('play');
      const LOGO_INTRO_MS = 1550;

      setTimeout(function () {
        reelsEl.classList.remove('hidden');
        setStagePhase('stage-reels');
        stage.classList.add('show');
        statusEl.textContent = 'Reels spinning... - ' + tier.label + ' table ' + table;

        lockReels(reelNodes, function () {
          const revealTextEl = document.getElementById('revealText');
          revealTextEl.classList.remove('reveal-hidden');
          setStagePhase('stage-impact');
          stage.classList.add('show');
          buildConfetti();
          buildMoneyBurst();
          statusEl.textContent = 'Now playing: ' + tier.label + ' - table ' + table;
          impactTimer = setTimeout(function () {
            if (!playing) return;
            setStagePhase('stage-hold');
            stage.classList.add('show');
          }, 700);
          holdScheduler.startAfterFinalReveal(tier.duration_seconds, function () {
            revealAudio.fadeOut(MUSIC_FADE_MS);
          }, function () {
            setStagePhase('stage-exit');
            stage.classList.remove('show');
            stopCoinRain();
            holdScheduler.clear();
            revealAudio.stopNow();
            playing = false;
            if (impactTimer) clearTimeout(impactTimer);
            statusEl.textContent = 'idle - press t to toggle this panel';
          });
        });
      }, LOGO_INTRO_MS);
    }, waitMs);
  }

  async function fetchConfig(url) {
    if (!url) return;
    try {
      const res = await fetch(url, { cache: 'no-store' });
      const data = await res.json();
      if (data && data.tiers) {
        CONFIG = data;
        revealAudio.preload(CONFIG);
        configPreview.textContent = JSON.stringify(data, null, 1);
        if (lastStatusUrl) watchActiveHours(lastStatusUrl);
      }
    } catch (err) {
      statusEl.textContent = 'Error reading config: ' + err.message;
    }
  }

  let pollTimer = null;
  let configTimer = null;
  let activeHoursCheckTimer = null;
  let lastStatusUrl = '';
  let lastOffHoursWatcherMs = null;
  function loadLastEventId() {
    try {
      const v = localStorage.getItem(LAST_EVENT_STORAGE_KEY);
      if (typeof v === 'string' && v.length > 0) return v;
    } catch (e) {}
    return null;
  }

  function persistLastEventId(id) {
    try {
      localStorage.setItem(LAST_EVENT_STORAGE_KEY, id);
    } catch (e) {}
  }

  function loadLastTestEventId() {
    try {
      const v = localStorage.getItem(LAST_TEST_STORAGE_KEY);
      if (typeof v === 'string' && v.length > 0) return v;
    } catch (e) {}
    return null;
  }

  function persistLastTestEventId(id) {
    try {
      localStorage.setItem(LAST_TEST_STORAGE_KEY, id);
    } catch (e) {}
  }

  let lastEventId = loadLastEventId();
  let lastTestEventId = loadLastTestEventId();

  // Uses the device's own local clock (the Android box is physically at the
  // venue, so its system clock should already reflect venue time).
  function toMinutesLocal(hhmm) {
    const [h, m] = String(hhmm).split(':').map(Number);
    return h * 60 + m;
  }
  function isWithinActiveHours() {
    if (!CONFIG.active_hours_start || !CONFIG.active_hours_end) return true; // guard disabled
    const now = new Date();
    const nowMinutes = now.getHours() * 60 + now.getMinutes();
    const start = toMinutesLocal(CONFIG.active_hours_start);
    const end = toMinutesLocal(CONFIG.active_hours_end);
    if (start <= end) return nowMinutes >= start && nowMinutes <= end;
    return nowMinutes >= start || nowMinutes <= end; // wraps midnight
  }

  function consumeStatusPayload(data) {
    const prizeFallback = function (tierKey, rawPrize) {
      if (rawPrize) return rawPrize;
      const tier = CONFIG.tiers && CONFIG.tiers[tierKey];
      if (tier && tier.credit_text) return tier.credit_text;
      return REVEAL_TEST_PRIZE_FALLBACK;
    };
    const choice = chooseStatusPlayback(data, {
      playing: playing,
      withinHours: isWithinActiveHours(),
      lastEventId: lastEventId,
      lastTestEventId: lastTestEventId,
      nowStamp: formatLocalStamp(new Date())
    });
    if (choice.action === 'play_production') {
      lastEventId = choice.id;
      persistLastEventId(choice.id);
      playJackpot(choice.tier, choice.table, choice.prize, choice.delaySeconds);
      return;
    }
    if (choice.action === 'play_test') {
      lastTestEventId = choice.id;
      persistLastTestEventId(choice.id);
      playJackpot(choice.tier, choice.table, prizeFallback(choice.tier, choice.prize), 0);
    }
  }

  async function pollStatusOnce(statusUrl) {
    const res = await fetch(statusUrl, { cache: 'no-store' });
    const data = await res.json();
    consumeStatusPayload(data);
  }

  function startStatusPollLoop(statusUrl) {
    const pollMs = (CONFIG.status_polling_seconds || 5) * 1000;
    pollTimer = setInterval(async () => {
      try {
        await pollStatusOnce(statusUrl);
      } catch (err) {
        statusEl.textContent = 'Connection error: ' + err.message;
      }
    }, pollMs);
  }

  // Outside active hours the 5s production loop stays off. The same watcher
  // reuses GET /jackpot-status at CONFIG.off_hours_test_polling_seconds
  // (safe fallback 30) so Admin Reveal Test can still arrive. Production
  // Jackpot playback remains disabled off-hours.
  function offHoursWatcherMs() {
    return parseOffHoursTestPollingSeconds(CONFIG.off_hours_test_polling_seconds) * 1000;
  }

  function watchActiveHours(statusUrl) {
    lastStatusUrl = statusUrl;
    const ms = offHoursWatcherMs();
    if (activeHoursCheckTimer && lastOffHoursWatcherMs === ms) return;
    if (activeHoursCheckTimer) clearInterval(activeHoursCheckTimer);
    lastOffHoursWatcherMs = ms;
    activeHoursCheckTimer = setInterval(() => {
      const active = isWithinActiveHours();
      if (active && !pollTimer) {
        statusEl.textContent = 'Entering active hours - connecting to: ' + statusUrl;
        startStatusPollLoop(statusUrl);
      } else if (!active && pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
        statusEl.textContent = 'Outside active hours - idle, not polling';
      }
      if (!active) {
        pollStatusOnce(statusUrl).catch(function (err) {
          statusEl.textContent = 'Connection error: ' + err.message;
        });
      }
    }, ms);
  }

  async function startPolling(statusUrl, configUrl) {
    stopPolling();
    if (configUrl) {
      await fetchConfig(configUrl); // wait so active_hours / status_polling_seconds are known
      configTimer = setInterval(() => fetchConfig(configUrl), 5 * 60 * 1000);
    }
    watchActiveHours(statusUrl);
    if (isWithinActiveHours()) {
      statusEl.textContent = 'Connecting to: ' + statusUrl;
      startStatusPollLoop(statusUrl);
    } else {
      statusEl.textContent = 'Outside active hours - idle, not polling';
      pollStatusOnce(statusUrl).catch(function (err) {
        statusEl.textContent = 'Connection error: ' + err.message;
      });
    }
  }

  function stopPolling() {
    if (pollTimer) clearInterval(pollTimer);
    if (configTimer) clearInterval(configTimer);
    if (activeHoursCheckTimer) clearInterval(activeHoursCheckTimer);
    pollTimer = null;
    configTimer = null;
    activeHoursCheckTimer = null;
    lastOffHoursWatcherMs = null;
    lastStatusUrl = '';
  }

  document.getElementById('connectBtn').addEventListener('click', () => {
    const statusUrl = document.getElementById('statusUrl').value.trim();
    const configUrl = document.getElementById('configUrl').value.trim();
    if (statusUrl) startPolling(statusUrl, configUrl);
  });

  document.getElementById('fireBtn').addEventListener('click', () => {
    const tierKey = document.getElementById('tierSelect').value;
    const table = document.getElementById('tableInput').value || '--';
    playJackpot(tierKey, table, 'Manual test', 0);
  });

  document.getElementById('audioUnlockBtn').addEventListener('click', () => {
    const result = revealAudio.unlock();
    statusEl.textContent = result && result.ok
      ? 'Audio unlock attempted'
      : 'Audio unlock failed';
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 't') panel.classList.toggle('open');
  });

  const params = new URLSearchParams(location.search);
  if (params.get('config')) document.getElementById('configUrl').value = params.get('config');
  if (params.get('status')) document.getElementById('statusUrl').value = params.get('status');
  if (params.get('config') && params.get('status')) {
    startPolling(params.get('status'), params.get('config'));
  }

  setInterval(() => { document.title = 'Jackpot — ' + new Date().toLocaleTimeString('fa-IR'); }, 30000);
})();
</script>
</body>
</html>
